[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ammore"
version = "0.1.0"
description = "Agentic literature review on top of mmore."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat>=0.7.0",
    "autogen-core",
    "autogen-ext[openai,ollama]",
    "mmore[process,index,api]",
    "pymilvus",
    "python-dotenv",
    "pyyaml",
    "requests",
    "tavily-python",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[project.scripts]
ammore = "ammore.main:main"

[tool.setuptools.packages.find]
include = ["ammore*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
fixable = ["ALL"]
ignore = ["E501", "E402"]   # line length, module-level imports not at top

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["ammore", "evaluate.py"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
# AutoGen's BaseAgentEvent/BaseChatMessage don't declare .content but expose it at runtime.
reportAttributeAccessIssue = "none"
