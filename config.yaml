# AMMORE configuration. Defaults live in ammore/config.py — override only what you need.
# API keys go in .env.

provider: openai   # mistral | openai | ollama

mistral:
  model: mistral-small-latest

openai:
  model: gpt-4o-mini   # needs OPENAI_API_KEY in .env

ollama:
  model: llama3.2:3b

retrieval:
  max_matches: 6
  min_similarity: -1
  max_chunk_chars: 2000
  max_total_chars: 12000

websearch:
  enabled: true   # needs TAVILY_API_KEY in .env

document_metadata:
  mode: cheap   # cheap | llm | none

