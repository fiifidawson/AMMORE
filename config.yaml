# AMMORE configuration. Defaults live in ammore/config.py — override only what you need.
# API keys go in .env.

provider: mistral   # mistral | ollama

mistral:
  model: mistral-small-latest

ollama:
  model: llama3.2:3b

retrieval:
  max_matches: 3
  min_similarity: -1

websearch:
  enabled: true   # needs TAVILY_API_KEY in .env

document_metadata:
  mode: cheap   # cheap | llm | none
